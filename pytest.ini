[pytest]
markers =
    eval: golden-set evaluation tests (docs/generalization_plan.md Phase 4) --
        live local Ollama, run explicitly via `pytest -m eval`, not part of the
        regular suite (`pytest tests/ -k "not live"` never selects them).
        Metrics land in var/eval/<run_id>.json, not asserted pass/fail on a
        precision target -- see tests/eval/test_golden_sets.py's own docstring.
