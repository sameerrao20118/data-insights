# Legacy schema binding -- docs/generalization_plan.md Phase 1's actual
# proof of R1: a schema deliberately different from FDM (no bi-temporal
# versions, no PARTY/AGREEMENT split, different table names entirely --
# config/entities.yaml, generated by data_generator/generate_data.py)
# mapped onto the SAME canonical concepts config/bindings/fdm.yaml uses.
#
# Several concepts are genuinely unavailable under this schema -- stated
# honestly, not worked around:
#   - RiskGradeVersion, PartyMetricVersion: no bi-temporal risk-grade
#     history is contracted in config/entities.yaml (a risk_ratings.csv
#     file exists in the generated data but isn't contracted as an
#     entity there yet -- add it if a real need arises, per that file's
#     own "small vertical slice" convention; not invented here).
#   - CollateralValuation: no collateral data in this schema at all.
#   - Party.sector_code / Party.country_code / Party.high_risk_flag:
#     config/entities.yaml doesn't contract a standalone client-level
#     entity with these fields (clients.csv exists in generated output
#     but isn't in the contract) -- Party itself is therefore usable
#     only for party_id (derived from accounts.client_id), not full
#     RM-context fields. Consumers must degrade gracefully (see
#     datainsights/fdm_worklist.py's _client_context / agents/orchestrator.py's
#     _high_risk_flag), not crash.
schema: legacy
contract_ref: config/entities.yaml

concepts:
  Party:
    entity: accounts
    fields:
      party_id: client_id
    # No bitemporal versions, no demographic/locator join available under
    # this contract -- segment/sector_code/sector_name/country_code/
    # high_risk_flag/relationship_manager_id are simply absent from
    # `fields`, which CanonicalSource represents as a missing column, not
    # a crash. NOTE: unlike the other absent fields, relationship_manager_id
    # genuinely EXISTS as real data in data_generator/output/clients.csv --
    # it just isn't contracted as an entity in config/entities.yaml yet
    # (only transactions/accounts/balances are). Mapping it is real,
    # scoped, undone work (docs/gap_analysis.md), not a data gap.

  Account:
    entity: accounts
    fields:
      account_id: account_id
      party_id: client_id
      product_code: account_type
      original_limit: credit_limit
      close_date: close_date
    derived:
      product_class:
        from: account_type
        map: {current: deposit, savings: deposit, credit_facility: facility}
        default: other
      currency: {const: EUR}
    # fixed_rate_end_date: not in this schema (no mortgage product) --
    # left unmapped; Account rows simply have no such column, which
    # fixed_rate_expiry's tool (agents/tools.py) must treat as "no
    # mortgage" rather than crash on a missing key.

  BalanceObservation:
    entity: balances
    fields:
      account_id: account_id
      observed_at: date
      balance: closing_balance

  Transaction:
    entity: transactions
    fields:
      transaction_id: transaction_id
      account_id: account_id
      posted_at: booking_date
      amount: amount
      currency: currency
      # This schema's own `direction` column already holds "credit"/"debit"
      # verbatim -- unlike FDM (which derives direction from CRD/DBT codes
      # via a value map), this is a plain rename.
      direction: direction

  RiskGradeVersion:
    unavailable: "No bi-temporal risk-grade history contracted in config/entities.yaml (risk_ratings.csv exists in generated output but isn't a contracted entity). Add it there first, per that file's own convention, rather than inventing bi-temporal versions here."

  PartyMetricVersion:
    unavailable: "Same as FDM's binding -- no PD/metric history contracted anywhere in this repo."

  CollateralValuation:
    unavailable: "No collateral entity exists in config/entities.yaml or the legacy generator's output at all."
