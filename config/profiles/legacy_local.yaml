# The `legacy` schema's local profile -- proves the same agentic pipeline
# (agents/orchestrator.py) that runs `fdm_local` and `sba_local` also runs
# this structurally different, pre-FDM schema (no bi-temporal versions,
# different table names entirely -- config/entities.yaml,
# data_generator/generate_data.py) via config/bindings/legacy.yaml alone,
# with zero code changes. Previously only proven at pytest-sample scale
# (tests/test_legacy_binding_end_to_end.py); this profile is what lets
# the dashboard run it as a real whole-book demo like the other schemas.
#
# No event_source configured -- no exogenous event fixture exists for
# this schema; the endogenous detectors (deposits/lending) are the proof
# here, same scope as tests/test_legacy_binding_end_to_end.py.
config_version: 1
profile: legacy_local
runtime:
  target: local
source:
  backend: offline_local_flat
  entity_map_ref: config/entities.yaml
  data_dir: data_generator/output
  binding: legacy
  access: read_only
  cost_policy: no_cost_local_files
analytics:
  backend: duckdb_local
llm:
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: qwen2.5:7b
  allow_remote_inference: false
  allow_paid_fallback: false
  fallback: deterministic_template
state:
  backend: sqlite
  path: var/agent_traces.db
output:
  backend: local
  path: var/insights
monitor:
  enabled: false
  interval_minutes: 60
  max_concurrent_runs: 1
cost:
  paid_llm_calls_allowed: false
  paid_cloud_services_allowed: false
