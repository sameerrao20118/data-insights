# FDM-aligned build's local profile -- read by datainsights/runtime.py's
# build_runtime(), the single composition point Phase 0
# (docs/generalization_plan.md) introduced. Every value below matches
# what agents/demo_fdm_scenario.py etc. hard-coded before this profile
# existed; running against this profile must be byte-identical to that.
config_version: 1
profile: fdm_local
runtime:
  target: local
source:
  backend: offline_local
  entity_map_ref: config/entities_fdm.yaml
  data_dir: data_generator/output_fdm
  binding: fdm
  access: read_only
  cost_policy: no_cost_local_files
analytics:
  backend: duckdb_local
llm:
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: qwen2.5:7b
  allow_remote_inference: false
  allow_paid_fallback: false
  fallback: deterministic_template
  # Per-task model overrides. `model` above stays the default.
  #
  # proposer: onboarding/signal_proposer.py's output becomes pipeline
  # configuration, so it must reliably fill a structured-output schema.
  # Probed 4x on each of two candidates: qwen2.5:7b managed 0/4 (it
  # reasons correctly in prose, then fails the tool call), llama3.1:8b
  # 4/4 and faster. gpt-oss:20b is also 4/4 but ~3x slower and rated a
  # weak candidate 0.90 where llama3.1 rated it 0.12.
  task_models:
    proposer: llama3.1:8b
event_source:
  backend: csv
  path: external_events/output_fdm/tender_events.csv
state:
  backend: sqlite
  path: var/agent_traces.db
output:
  backend: local
  path: var/insights
monitor:
  enabled: false            # set true and run `python -m datainsights.monitor` for a clock-driven micro-batch (R11)
  interval_minutes: 60
  max_concurrent_runs: 1    # R19: a second overlapping run raises, never corrupts state
  lookback_ref: cash_buildup.window_days   # rows older than this many days never count as "new"
# R21: who is looking. The demo signs in a supervisor so the whole book is
# visible; to see the book as ONE relationship manager, no config edit:
#   DATAINSIGHTS_ROLE=rm DATAINSIGHTS_RM_IDS=RM001 streamlit run dashboard/app.py
# provider: idp is the Stage-3 contract (declared, NOT RUN).
identity:
  provider: local_dev
  user: demo_supervisor
  role: supervisor
  rm_ids: []
cost:
  paid_llm_calls_allowed: false
  paid_cloud_services_allowed: false
