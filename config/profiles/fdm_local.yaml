# FDM-aligned build's local profile -- read by datainsights/runtime.py's
# build_runtime(), the single composition point Phase 0
# (docs/generalization_plan.md) introduced. Every value below matches
# what agents/demo_fdm_scenario.py etc. hard-coded before this profile
# existed; running against this profile must be byte-identical to that.
config_version: 1
profile: fdm_local
runtime:
  target: local
source:
  backend: offline_local
  entity_map_ref: config/entities_fdm.yaml
  data_dir: data_generator/output_fdm
  binding: fdm
  access: read_only
  cost_policy: no_cost_local_files
analytics:
  backend: duckdb_local
llm:
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: qwen2.5:7b
  allow_remote_inference: false
  allow_paid_fallback: false
  fallback: deterministic_template
event_source:
  backend: csv
  path: external_events/output_fdm/tender_events.csv
state:
  backend: sqlite
  path: var/agent_traces.db
output:
  backend: local
  path: var/insights
monitor:
  enabled: false
  interval_minutes: 60
  max_concurrent_runs: 1
cost:
  paid_llm_calls_allowed: false
  paid_cloud_services_allowed: false
